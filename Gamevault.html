
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Vault</title>
<style>
:root {
  --bg:#121212;
  --panel:#1e1e1e;
  --card:#272727;
  --accent:#1683ff;
  --muted:#aaa;
  --border:#3a3a3a;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:white;
  font-family:Arial,sans-serif;
}
header {
  background:var(--panel);
  text-align:center;
  padding:18px 14px;
}
header h1 { margin:0 0 5px; }
header p { margin:0;color:var(--muted); }
main { max-width:850px;margin:auto;padding:15px; }
nav {
  display:flex;
  background:#292929;
  position:sticky;
  top:0;
  z-index:4;
}
nav button {
  flex:1;
  border-radius:0;
  background:#292929;
  padding:14px 7px;
}
nav button.active { background:var(--accent); }
button {
  border:0;
  border-radius:8px;
  background:var(--accent);
  color:white;
  padding:10px 13px;
  cursor:pointer;
}
button:disabled { opacity:.5; }
button.secondary { background:#444; }
button.danger { background:#b83b3b; }
button.small { padding:7px 10px;font-size:13px; }
input,select {
  width:100%;
  padding:11px;
  margin:7px 0 12px;
  background:#181818;
  color:white;
  border:1px solid var(--border);
  border-radius:8px;
}
label { font-size:14px;color:#ddd; }
.page { display:none; }
.page.active { display:block; }
.auth-card {
  max-width:440px;
  margin:20px auto;
  background:var(--panel);
  padding:18px;
  border-radius:12px;
}
.auth-card h2 { margin-top:0; }
.auth-switch {
  text-align:center;
  color:var(--muted);
  font-size:14px;
}
.auth-switch button {
  background:transparent;
  color:#78b7ff;
  padding:4px;
}
#authMessage,#message {
  min-height:18px;
  font-size:13px;
  color:#ffcf70;
}
.userbar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:10px 15px;
  background:#191919;
  font-size:13px;
}
.search-row { display:flex;gap:8px; }
.search-row input { flex:1;min-width:0; }
.search-row button { margin-top:7px;height:40px; }
.game-card {
  display:grid;
  grid-template-columns:90px 1fr;
  gap:12px;
  background:var(--card);
  padding:12px;
  border-radius:10px;
  margin-top:12px;
}
.cover {
  width:100%;
  height:125px;
  object-fit:cover;
  background:#333;
  border-radius:7px;
}
.game-card h3,.library-card h3 {
  font-size:17px;
  margin:3px 0 7px;
  overflow-wrap:anywhere;
}
.muted { color:var(--muted);font-size:13px; }
.library-card {
  background:var(--card);
  padding:12px;
  border-radius:10px;
  margin-top:10px;
}
.library-top { display:flex;gap:12px; }
.library-top .cover {
  width:75px;
  height:100px;
  flex-shrink:0;
}
.library-info { min-width:0;flex:1; }
.card-actions {
  position: absolute;
  top: 8px;
  right: 8px;
  display: flex;
  gap: 4px;
  margin: 0;
}
.status-group { margin-top:18px; }
.status-group h3 {
  font-size:16px;
  border-bottom:1px solid var(--border);
  padding-bottom:8px;
}
.stats {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
  margin:12px 0;
}
.stat {
  background:#242424;
  padding:12px;
  border-radius:9px;
  font-size:13px;
}
.stat strong {
  display:block;
  font-size:20px;
  margin-top:4px;
}
.empty {
  text-align:center;
  color:var(--muted);
  padding:22px 8px;
}
.modal-backdrop {
  display:none;
  position:fixed;
  inset:0;
  background:#000b;
  z-index:20;
  align-items:center;
  justify-content:center;
  padding:16px;
}
.modal-backdrop.open { display:flex; }
.modal {
  width:100%;
  max-width:430px;
  max-height:90vh;
  overflow:auto;
  background:#202020;
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
}
.modal h2 { margin:0 0 16px; }
.modal-actions {
  display:flex;
  gap:8px;
  margin-top:16px;
}
.modal-actions button { flex:1; }
.rating-picks {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
  margin:8px 0 14px;
}
.rating-picks button {
  background:#383838;
  padding:12px 5px;
  font-weight:bold;
  border:1px solid #555;
}
.rating-picks button.selected {
  background:var(--accent);
  border-color:#78b7ff;
}
.rating-caption {
  color:var(--muted);
  font-size:13px;
  min-height:18px;
}
@media(min-width:620px) {
  .library-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
}
.library-card {
  position: relative;
  background: var(--card);
  padding: 35px 12px 12px;
  border-radius: 10px;
  margin-top: 10px;
}

.card-actions {
  position: absolute;
  top: 7px;
  right: 7px;
  display: flex;
  gap: 4px;
  z-index: 2;
}

.card-actions button {
  padding: 4px 7px;
  font-size: 10px;
  min-width: auto;
  border-radius: 5px;
    }
/* Clickable Statistics */
button.stat {
  width: 100%;
  text-align: left;
  color: white;
  background: #242424;
  border: 2px solid transparent;
  cursor: pointer;
}

button.stat.active {
  border-color: var(--accent);
  background: #183452;
}

/* Status section controls */
.status-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.status-heading h3 {
  flex: 1;
}

.status-toggle {
  padding: 5px 11px;
  font-size: 14px;
  min-width: 35px;
  }
  /* Explore recommendations */
.recommendation-section {
  margin-top: 25px;
}

.recommendation-section h3 {
  font-size: 18px;
  margin-bottom: 12px;
}

.recommendation-grid {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding: 3px 2px 12px;
  scroll-snap-type: x mandatory;
  scrollbar-width: thin;
}

.recommendation-card {
  flex: 0 0 145px;
  min-width: 0;
  background: var(--card);
  padding: 9px;
  border-radius: 10px;
  scroll-snap-align: start;
}

.recommendation-card img {
  width: 100%;
  height: 185px;
  object-fit: cover;
  border-radius: 7px;
  background: #333;
}

.recommendation-card h4 {
  font-size: 13px;
  min-height: 32px;
  overflow-wrap: anywhere;
  margin: 8px 0;
}

.recommendation-card button {
  width: 100%;
  padding: 8px 5px;
  font-size: 12px;
}

@media(min-width:620px) {
  .recommendation-card {
    flex-basis: 170px;
  }

  .recommendation-card img {
    height: 210px;
  }
}
  
/* PROFILE DESIGN */

.profile-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  max-width: 480px;
  margin: 20px auto;
  text-align: center;
}

.profile-avatar {
  width: 85px;
  height: 85px;
  border-radius: 50%;
  background: var(--card);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 42px;
  margin: 0 auto 12px;
  overflow: hidden;
}

.profile-card h2 {
  margin: 8px 0 4px;
}

.profile-subtitle {
  color: var(--muted);
  font-size: 13px;
  margin-top: 0;
}

.profile-divider {
  height: 1px;
  background: var(--border);
  margin: 20px 0;
}

.profile-card label {
  display: block;
  text-align: left;
  margin: 14px 0 6px;
  font-size: 13px;
  color: var(--muted);
}

.profile-card input,
.profile-card select {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--card);
  color: white;
}

.profile-card button {
  width: 100%;
  margin-top: 18px;
  padding: 12px;
  border-radius: 8px;
}

.ranking-card {
  padding: 10px;
  margin-bottom: 8px;
}

.ranking-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.ranking-header h3 {
  font-size: 14px;
  margin: 0;
}

.ranking-header span {
  font-size: 12px;
  color: #aaa;
}

.ranking-stats {
  display: flex;
  gap: 8px;
}

.ranking-stat {
  flex: 1;
  background: var(--card);
  padding: 8px;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.ranking-stat small {
  font-size: 11px;
  color: var(--muted);
}

.ranking-stat strong {
  font-size: 16px;
}
  
/* PLAYER LIBRARY */

.player-library-header {
  margin-bottom: 12px;
}

.player-library-header h2 {
  font-size: 18px;
  margin-bottom: 8px;
}

.player-library-header p {
  font-size: 11px;
  color: var(--muted);
  margin-top: 6px;
}

.back-player-btn {
  background: #303030;
  color: #cccccc;
  border: 1px solid #444444;
  padding: 6px 10px;
  font-size: 11px;
  border-radius: 6px;
  width: auto;
  margin: 4px 0;
}

.back-player-btn:hover {
  background: #383838;
}


.player-game-list {
  display: flex;
  flex-direction: row;
  gap: 12px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 8px 2px 14px;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
}

.player-game-card {
  display: flex;
  flex-direction: column;
  flex: 0 0 135px;
  scroll-snap-align: start;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 9px;
}

.player-game-cover {
  width: 100%;
  height: 150px;
  object-fit: cover;
  border-radius: 6px;
}

.player-game-info h3 {
  font-size: 13px;
  margin: 7px 0;
}

.player-game-info p {
  font-size: 11px;
  color: var(--muted);
  margin: 4px 0;
}

.view-library-btn {
  background: #303030;
  color: #cccccc;
  border: 1px solid #444444;
  padding: 6px 10px;
  font-size: 11px;
  border-radius: 6px;
  width: auto;
  min-width: 0;
  margin-top: 6px;
}

.view-library-btn:hover {
  background: #3a3a3a;
}


</style>
</>
<body>

<header>
  <h1>Game Vault</h1>
  <p>Your personal game collection</p>
</header>

<section id="authPage" class="page active">
  <div class="auth-card">
    <h2 id="authTitle">Login</h2>
    <p class="muted">Sign in to access your own game library.</p>

    <form id="authForm">
      <div id="usernameField" style="display:none">
        <label for="username">Username</label>
        <input id="username" autocomplete="username"
          maxlength="30" placeholder="Choose a username">
      </div>

      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email"
        required placeholder="you@example.com">

      <label for="password">Password</label>
      <input id="password" type="password"
        autocomplete="current-password" minlength="6"
        required placeholder="At least 6 characters">

      <button id="authSubmit" type="submit" style="width:100%">
        Login
      </button>
    </form>

    <p id="authMessage"></p>

    <p class="auth-switch">
      <span id="authSwitchText">Don't have an account?</span>
      <button type="button" id="authSwitch" onclick="switchAuth()">
        Sign up
      </button>
    </p>
  </div>
</section>

<div id="app" style="display:none">
  <div class="userbar">
    <span id="welcome"></span>
    <button class="secondary small" onclick="logout()">Logout</button>
  </div>

  <nav>
  <button id="exploreTab" class="active"
    onclick="showPage('explorePage',this)">Explore</button>

  <button id="libraryTab"
    onclick="showPage('libraryPage',this)">My Library</button>

  <button id="playersTab"
    onclick="showPage('playersPage',this)">Players</button>

  <button id="rankingsTab"
    onclick="showPage('rankingsPage',this)">Rankings</button>

  <button id="profileTab"
    onclick="showPage('profilePage',this)">Profile</button>
  </nav>

  <main>
    <section id="explorePage" class="page active">
      <h2>Browse Games</h2>
      <div class="search-row">
        <input id="apiSearch" type="search"
          placeholder="Search games..."
          onkeydown="if(event.key==='Enter')searchRAWG()">
        <button onclick="searchRAWG()">Search</button>
      </div>
      <p id="message"></p>
<div id="results"></div>

<hr style="border-color:#3a3a3a;margin:25px 0;">

<div id="recommendations">
  <h2>Discover Games</h2>

  <label for="genreFilter">Filter by Genre</label>
  <select id="genreFilter" onchange="loadExploreRecommendations()">
    <option value="">All Genres</option>
    <option value="action">Action</option>
    <option value="adventure">Adventure</option>
    <option value="role-playing-games-rpg">RPG</option>
    <option value="shooter">Shooter</option>
    <option value="strategy">Strategy</option>
    <option value="puzzle">Puzzle</option>
    <option value="simulation">Simulation</option>
    <option value="sports">Sports</option>
    <option value="racing">Racing</option>
    <option value="horror">Horror</option>
  </select>

  <button class="secondary" onclick="loadExploreRecommendations()">
    ↻ Refresh Recommendations
  </button>

  <div id="recommendationMessage" class="muted"></div>

  <div id="recommendationSections"></div>
</div>
    </section>

    <section id="libraryPage" class="page">
      <h2>My Library</h2>
      <input id="librarySearch" type="search"
        placeholder="Search your games..."
        oninput="renderLibrary()">

      <button class="secondary" onclick="toggleStats()">
        Show / Hide Statistics
      </button>

      <div id="stats" class="stats"></div>
      <div id="library"></div>
    </section>
    <section id="playersPage" class="page">
  <h2>Explore Players</h2>

  <input id="playerSearch"
    placeholder="Search username..."
    oninput="searchPlayers()">

  <div id="playerResults"></div>
  <div id="playerLibrary"></div>
</section>

<section id="rankingsPage" class="page">
  <h2>🏆 Global Rankings</h2>
  <div id="leaderboard"></div>
</section>

<section id="profilePage" class="page">
  <h2>My Profile</h2>
  <div id="profileContent">
    Loading profile...
  </div>
</section>
  </main>
</div>

<div id="gameModal" class="modal-backdrop"
  role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <h2 id="modalTitle">Rate This Game</h2>

    <label for="editName">Game name</label>
    <input id="editName" maxlength="120">

    <label for="editStatus">Status</label>
    <select id="editStatus">
      <option>Ongoing</option>
      <option>Completed</option>
      <option>Plan to Play</option>
      <option>On Hold</option>
      <option>Dropped</option>
    </select>

    <label>Your rating (1–10)</label>
    <div id="ratingPicks" class="rating-picks"></div>

    <div id="ratingCaption" class="rating-caption">
      Choose a rating, or leave it unrated.
    </div>

    <div class="modal-actions">
      <button type="button" class="secondary"
        onclick="closeGameModal()">Cancel</button>
      <button type="button" onclick="saveGameModal()">Save</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// SUPABASE CONNECTION SETTINGS
const SUPABASE_URL = "https://gsaijezjmvmepyxcgpij.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_0qqS2p_EN8UDFwBc-n4siQ_mHmxWbSD";

// RAWG API SETTINGS
const RAWG_API_KEY = "3cb3711c2da64f2a9aeee46cb9f8e01d";

let supabaseClient = null;
let currentUser = null;
let games = [];
let isSignup = false;
let searchResults = [];
let editingGameId = null;
let selectedRating = null;
let afterAddMode = false;
let recommendationGames = [];
let recommendationLoading = false;

async function fetchRAWGGames(params) {
  const url = new URL("https://api.rawg.io/api/games");

  url.searchParams.set("key", RAWG_API_KEY);
  url.searchParams.set("page_size", "8");

  Object.entries(params).forEach(([key, value]) => {
    if (value) {
      url.searchParams.set(key, value);
    }
  });

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error("RAWG request failed: " + response.status);
  }

  const data = await response.json();
  return data.results || [];
}

function shuffleGames(list) {
  return [...list].sort(() => Math.random() - 0.5);
}

function renderRecommendationSection(title, list) {
  if (!list.length) return "";

  return `
    <div class="recommendation-section">
      <h3>${title}</h3>

      <div class="recommendation-grid">
        ${list.map(game => `
          <article class="recommendation-card">
            <img
              src="${escapeHTML(game.background_image || "")}"
              alt="Game cover"
              loading="lazy"
              onerror="this.style.visibility='hidden'">

            <h4>${escapeHTML(game.name)}</h4>

            <p class="muted">
              Rating: ${game.rating || "Not rated"}
            </p>

            <button onclick="addGame('${String(game.id)}')">
              + Add to Library
            </button>
          </article>
        `).join("")}
      </div>
    </div>
  `;
}

async function loadExploreRecommendations() {
  if (recommendationLoading) return;

  recommendationLoading = true;

  const message =
    document.getElementById("recommendationMessage");

  const sections =
    document.getElementById("recommendationSections");

  if (!message || !sections) {
    recommendationLoading = false;
    return;
  }

  message.textContent = "Loading game recommendations...";
  sections.innerHTML = "";

  try {
    const genre =
      document.getElementById("genreFilter").value;

    const today = new Date().toISOString().slice(0, 10);

    const future = new Date();
    future.setFullYear(future.getFullYear() + 1);

    const futureDate = future.toISOString().slice(0, 10);

    const genreParams = genre ? { genres: genre } : {};

    const [popular, topRated, upcoming] = await Promise.all([
      fetchRAWGGames({
        ...genreParams,
        ordering: "-added"
      }),

      fetchRAWGGames({
        ...genreParams,
        ordering: "-rating"
      }),

      fetchRAWGGames({
        ...genreParams,
        dates: `${today},${futureDate}`,
        ordering: "-added"
      })
    ]);

    const ownedIds = new Set(
      games.map(game => String(game.rawg_id))
    );

    const uniqueGames = new Map();

    [...popular, ...topRated, ...upcoming].forEach(game => {
      uniqueGames.set(String(game.id), game);
    });

    recommendationGames = [...uniqueGames.values()];

    const recommended = recommendationGames.filter(game =>
      !ownedIds.has(String(game.id))
    );

    const randomPick = shuffleGames(recommended).slice(0, 4);

    sections.innerHTML =
      renderRecommendationSection("🔥 Popular Games", popular) +
      renderRecommendationSection("⭐ Top Rated", topRated) +
      renderRecommendationSection("📅 Upcoming Games", upcoming) +
      renderRecommendationSection("🎲 Random Pick", randomPick) +
      renderRecommendationSection("💡 Recommended for You", recommended);

    if (!sections.innerHTML) {
      message.textContent = "No recommendations found.";
    } else {
      message.textContent = "";
    }

  } catch (error) {
    message.textContent =
      "Could not load recommendations. Check your internet connection or RAWG API key.";
  } finally {
    recommendationLoading = false;
  }
}
let selectedStatFilter = "All";
let collapsedStatuses = {};

function setStatFilter(filter) {
  selectedStatFilter = filter;
  renderLibrary();
}

function toggleStatusGroup(status) {
  collapsedStatuses[status] = !collapsedStatuses[status];
  renderLibrary();
}

function toggleStats() {
  const box = document.getElementById("stats");
  box.style.display =
    box.style.display === "none" ? "grid" : "none";
}

function renderStats() {
  const box = document.getElementById("stats");
  if (!box) return;

  const ratedGames = games.filter(
    game => game.rating != null && Number.isFinite(Number(game.rating))
  );

  const average = ratedGames.length
    ? (ratedGames.reduce(
        (sum, game) => sum + Number(game.rating), 0
      ) / ratedGames.length).toFixed(1)
    : "—";

  const stats = [
    { name: "Total Games", filter: "All", count: games.length },
    { name: "Completed", filter: "Completed",
      count: games.filter(g => g.status === "Completed").length },
    { name: "Ongoing", filter: "Ongoing",
      count: games.filter(g => g.status === "Ongoing").length },
    { name: "Plan to Play", filter: "Plan to Play",
      count: games.filter(g => g.status === "Plan to Play").length },
    { name: "On Hold", filter: "On Hold",
      count: games.filter(g => g.status === "On Hold").length },
    { name: "Dropped", filter: "Dropped",
      count: games.filter(g => g.status === "Dropped").length },
    { name: "Average Rating", filter: "Rated", count: average }
  ];

  box.innerHTML = stats.map(stat => `
    <button class="stat ${
      selectedStatFilter === stat.filter ? "active" : ""
    }" onclick="setStatFilter('${stat.filter}')">
      ${stat.name}
      <strong>${stat.count}</strong>
    </button>
  `).join("");
}

function configured() {
  return SUPABASE_URL.startsWith("https://") &&
    !SUPABASE_URL.includes("YOUR_") &&
    SUPABASE_ANON_KEY &&
    !SUPABASE_ANON_KEY.includes("YOUR_");
}

function showAuthMessage(message) {
  document.getElementById("authMessage").textContent = message || "";
}

function switchAuth() {
  isSignup = !isSignup;

  document.getElementById("authTitle").textContent =
    isSignup ? "Create Account" : "Login";

  document.getElementById("authSubmit").textContent =
    isSignup ? "Sign Up" : "Login";

  document.getElementById("usernameField").style.display =
    isSignup ? "block" : "none";

  document.getElementById("username").required = isSignup;

  document.getElementById("password").autocomplete =
    isSignup ? "new-password" : "current-password";

  document.getElementById("authSwitchText").textContent =
    isSignup ? "Already have an account?" : "Don't have an account?";

  document.getElementById("authSwitch").textContent =
    isSignup ? "Login" : "Sign up";

  showAuthMessage("");
}

async function initialize() {
  if (!configured()) {
    showAuthMessage("Please add your Supabase connection settings.");
    return;
  }

  if (!window.supabase) {
    showAuthMessage("Supabase could not load. Check your internet connection.");
    return;
  }

  supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  const { data: { session } } =
    await supabaseClient.auth.getSession();

  if (session?.user) {
    await enterApp(session.user);
  }

  supabaseClient.auth.onAuthStateChange(async (event, session) => {
    if (session?.user) {
      await enterApp(session.user);
    } else {
      currentUser = null;
      games = [];
      document.getElementById("app").style.display = "none";
      document.getElementById("authPage").classList.add("active");
    }
  });
}

document.getElementById("authForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (!configured() || !supabaseClient) {
    showAuthMessage("Supabase connection is not ready.");
    return;
  }

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const username = document.getElementById("username").value.trim();
  const submit = document.getElementById("authSubmit");

  submit.disabled = true;
  showAuthMessage(isSignup ? "Creating account..." : "Signing in...");

  try {
    if (isSignup) {
      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: { data: { username } }
      });

      if (error) throw error;

      if (data.session) {
        await enterApp(data.user);
      } else {
        showAuthMessage("Account created. You can now log in.");
      }
    } else {
      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if (error) throw error;
      await enterApp(data.user);
    }
  } catch (error) {
    showAuthMessage(error.message || "Account request failed.");
  } finally {
    submit.disabled = false;
  }
});

async function enterApp(user) {
  currentUser = user;

  document.getElementById("authPage").classList.remove("active");
  document.getElementById("app").style.display = "block";

  document.getElementById("welcome").textContent =
    "Signed in: " +
    (user.user_metadata?.username || user.email || "Player");

  await loadGames();
}

async function logout() {
  if (supabaseClient) {
    await supabaseClient.auth.signOut();
  }
}

async function loadGames() {
  const { data, error } = await supabaseClient
    .from("games")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    alert("Could not load library: " + error.message);
    return;
  }

  games = data || [];
  renderLibrary();
}

function showPage(pageId, button) {
  document.querySelectorAll("main .page").forEach(page => {
    page.classList.remove("active");
  });

  document.getElementById(pageId).classList.add("active");

  document.querySelectorAll("nav button").forEach(btn => {
    btn.classList.remove("active");
  });

  button.classList.add("active");

  if (pageId === "playersPage") {
    searchPlayers();
  }

  if (pageId === "rankingsPage") {
    loadLeaderboard();
  }

  if (pageId === "profilePage") {
    loadMyProfile();
  }
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[character]));
}

async function searchRAWG() {
  const query = document.getElementById("apiSearch").value.trim();
  const message = document.getElementById("message");
  const results = document.getElementById("results");

  if (!query) {
    message.textContent = "Enter a game name first.";
    return;
  }

  message.textContent = "Searching...";
  results.innerHTML = "";

  try {
    const response = await fetch(
      `https://api.rawg.io/api/games?key=${encodeURIComponent(RAWG_API_KEY)}&search=${encodeURIComponent(query)}&page_size=12`
    );

    if (!response.ok) throw new Error("Search failed");

    const data = await response.json();
    searchResults = data.results || [];
    message.textContent = "";

    if (!searchResults.length) {
      results.innerHTML =
        '<p class="empty">No games found.</p>';
      return;
    }

    results.innerHTML = searchResults.map(game => `
      <article class="game-card">
        <img class="cover"
          src="${escapeHTML(game.background_image || "")}"
          alt="Game cover"
          loading="lazy"
          onerror="this.style.visibility='hidden'">

        <div>
          <h3>${escapeHTML(game.name)}</h3>
          <p class="muted">
            RAWG rating: ${game.rating || "Not rated"}<br>
            Release: ${escapeHTML(game.released || "Unknown")}
          </p>
          <button onclick="addGame('${String(game.id)}')">
            Add to Library
          </button>
        </div>
      </article>
    `).join("");

  } catch (error) {
    message.textContent =
      "Could not search. Check your internet connection and RAWG API key.";
  }
}

function buildRatingButtons() {
  const box = document.getElementById("ratingPicks");

  box.innerHTML = Array.from({ length: 10 }, (_, index) => index + 1)
    .map(number => `
      <button type="button"
        data-rating="${number}"
        onclick="chooseRating(${number})">
        ${number}
      </button>
    `).join("");

  refreshRatingButtons();
}

function chooseRating(value) {
  selectedRating = value;
  refreshRatingButtons();
}

function refreshRatingButtons() {
  document.querySelectorAll("#ratingPicks button").forEach(button => {
    button.classList.toggle(
      "selected",
      Number(button.dataset.rating) === selectedRating
    );
  });

  document.getElementById("ratingCaption").textContent =
    selectedRating
      ? `Your rating: ${selectedRating} (out of 10)`
      : "Choose a rating from 1–10, or leave it unrated.";
}

function openGameModal(game, isNew = false) {
  editingGameId = game.id;
  afterAddMode = isNew;
  selectedRating = game.rating == null ? null : Number(game.rating);

  document.getElementById("modalTitle").textContent =
    isNew ? "Rate This Game" : "Edit Game";

  document.getElementById("editName").value = game.name || "";

  document.getElementById("editStatus").value =
    game.status || "Plan to Play";

  buildRatingButtons();

  document.getElementById("gameModal").classList.add("open");
}

function closeGameModal() {
  document.getElementById("gameModal").classList.remove("open");
  editingGameId = null;
}

async function addGame(rawgId) {
  const game = searchResults.find(
    item => String(item.id) === String(rawgId)
  );

  if (!game) return;

  if (games.some(item => String(item.rawg_id) === String(game.id))) {
    alert("This game is already in your library.");
    return;
  }

  const payload = {
    user_id: currentUser.id,
    rawg_id: String(game.id),
    name: game.name,
    cover_url: game.background_image || "",
    status: "Plan to Play",
    rating: null
  };

  const { data, error } = await supabaseClient
    .from("games")
    .insert(payload)
    .select()
    .single();

  if (error) {
    alert("Could not add game: " + error.message);
    return;
  }

  games.unshift(data);
  renderLibrary();

  showPage("libraryPage", document.getElementById("libraryTab"));

  // Open rating and status options immediately after adding.
  openGameModal(data, true);
}

function editGame(id) {
  const game = games.find(item => item.id === id);
  if (game) openGameModal(game, false);
}

async function saveGameModal() {
  const game = games.find(item => item.id === editingGameId);
  if (!game) return;

  const name = document.getElementById("editName").value.trim();
  const status = document.getElementById("editStatus").value;

  if (!name) {
    alert("Game name cannot be empty.");
    return;
  }

  const update = {
    name,
    status,
    rating: selectedRating
  };

  const { data, error } = await supabaseClient
    .from("games")
    .update(update)
    .eq("id", editingGameId)
    .select()
    .single();

  if (error) {
    alert("Could not save changes: " + error.message);
    return;
  }

  games = games.map(item =>
    item.id === editingGameId ? data : item
  );

  closeGameModal();
  renderLibrary();
}

async function deleteGame(id) {
  const game = games.find(item => item.id === id);

  if (!game || !confirm(`Remove "${game.name}" from your library?`)) {
    return;
  }

  const { error } = await supabaseClient
    .from("games")
    .delete()
    .eq("id", id);

  if (error) {
    alert("Could not delete: " + error.message);
    return;
  }

  games = games.filter(item => item.id !== id);
  renderLibrary();
}

function renderLibrary() {
  const target = document.getElementById("library");
  if (!target) return;

  renderStats();

  const query = (
    document.getElementById("librarySearch")?.value || ""
  ).trim().toLowerCase();

  let filtered = games.filter(game =>
    (game.name || "").toLowerCase().includes(query)
  );

  if (selectedStatFilter === "Rated") {
    filtered = filtered.filter(game => game.rating != null);
  } else if (selectedStatFilter !== "All") {
    filtered = filtered.filter(
      game => game.status === selectedStatFilter
    );
  }

  const order = [
    "Completed",
    "Ongoing",
    "Plan to Play",
    "On Hold",
    "Dropped"
  ];

  target.innerHTML = filtered.length
    ? order.map(status => {
        const subset = filtered.filter(
          game => game.status === status
        );

        if (!subset.length) return "";

        const isCollapsed = !!collapsedStatuses[status];

        return `
          <div class="status-group">

            <div class="status-heading">
              <h3>
                ${status}
                <span class="muted">(${subset.length})</span>
              </h3>

              <button class="secondary status-toggle"
                onclick="toggleStatusGroup('${status}')">
                ${isCollapsed ? "+" : "−"}
              </button>
            </div>

            ${isCollapsed ? "" : `
              <div class="library-grid">
                ${subset.map(game => `
                  <article class="library-card">

                    <div class="card-actions">
                      <button class="small"
                        onclick="editGame('${escapeHTML(game.id)}')">
                        Edit
                      </button>

                      <button class="small danger"
                        onclick="deleteGame('${escapeHTML(game.id)}')">
                        Delete
                      </button>
                    </div>

                    <div class="library-top">
                      <img class="cover"
                        src="${escapeHTML(game.cover_url || "")}"
                        alt="Game cover"
                        onerror="this.style.visibility='hidden'">

                      <div class="library-info">
                        <h3>${escapeHTML(game.name)}</h3>

                        <p class="muted">
                          Status: ${escapeHTML(game.status)}<br>
                          My Rating:
                          ${game.rating == null
                            ? "Not rated"
                            : escapeHTML(game.rating) + "/10"}
                        </p>
                      </div>
                    </div>

                  </article>
                `).join("")}
              </div>
            `}

          </div>
        `;
      }).join("")
    : '<p class="empty">No games match this selection.</p>';
}
  
// =====================================
// PLAYERS
// =====================================


async function searchPlayers() {
  const query = document.getElementById("playerSearch").value.trim();
  const results = document.getElementById("playerResults");

  results.innerHTML = "Searching players...";

  let request = supabaseClient
    .from("profiles")
    .select("user_id, username, avatar_url")
    .eq("is_public", true)
    .limit(20);

  if (query) {
    request = request.ilike("username", `%${query}%`);
  }

  const { data, error } = await request;

  if (error) {
    results.textContent = "Could not load players.";
    console.error(error);
    return;
  }

  if (!data || data.length === 0) {
    results.textContent = "No public players found.";
    return;
  }

  results.innerHTML = data.map(player => `
    <div class="game-card player-card">
      <h3>
        ${escapeHTML(player.avatar_url || "🎮")}
        ${escapeHTML(player.username)}
      </h3>

      <button class="view-library-btn"
        onclick="viewPlayerLibrary('${player.user_id}')">
        View Library
      </button>
    </div>
  `).join("");
}

  
// =====================================
// VIEW ANOTHER PLAYER'S LIBRARY
// =====================================



async function viewPlayerLibrary(userId, status = null) {
  const area = document.getElementById("playerLibrary");

  area.innerHTML = "Loading library...";

  // Get public player profile
  const { data: profile, error: profileError } =
    await supabaseClient
      .from("profiles")
      .select("username, avatar_url")
      .eq("user_id", userId)
      .eq("is_public", true)
      .single();

  if (profileError || !profile) {
    area.textContent = "This profile is unavailable or private.";
    return;
  }

  // Get the player's games
  let request = supabaseClient
    .from("games")
    .select("id, name, cover_url, status, rating")
    .eq("user_id", userId)
    .order("created_at", { ascending: false });

  if (status) {
    request = request.eq("status", status);
  }

  const { data: playerGames, error } = await request;

  if (error) {
    area.textContent = "Could not load this library.";
    console.error(error);
    return;
  }

  area.innerHTML = `
    <div class="player-library-header">
      <h2>
        ${escapeHTML(profile.avatar_url || "🎮")}
        ${escapeHTML(profile.username)}'s Library
      </h2>

      <button class="back-player-btn"
        onclick="closePlayerLibrary()">
        ← Back to Players
      </button>

      <p>Public Library · View Only</p>
    </div>

    <div class="player-game-list">
      ${
        !playerGames || playerGames.length === 0
          ? "<p>No games found.</p>"
          : playerGames.map(game => `
            <div class="player-game-card">

              ${
                game.cover_url
                  ? `<img class="player-game-cover"
                       src="${escapeHTML(game.cover_url)}"
                       alt="${escapeHTML(game.name)}">`
                  : `<div class="player-game-cover no-cover">
                       🎮
                     </div>`
              }

              <div class="player-game-info">
                <h3>${escapeHTML(game.name)}</h3>
                <p>${escapeHTML(game.status || "No status")}</p>
                <p>⭐ Rating: ${game.rating ?? "Not rated"}</p>
              </div>

            </div>
          `).join("")
      }
    </div>
  `;
}

async function loadLeaderboard() {
  const area = document.getElementById("leaderboard");

  area.innerHTML = "Loading rankings...";

  const { data, error } = await supabaseClient
    .rpc("get_leaderboard");

  if (error) {
    area.textContent = "Could not load rankings.";
    console.error(error);
    return;
  }

  if (!data || data.length === 0) {
    area.textContent = "No rankings available yet.";
    return;
  }

  area.innerHTML = data.map((player, index) => `
    <div class="game-card ranking-card">
      <div class="ranking-header">
        <h3>
          ${index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : "#" + (index + 1)}
          ${escapeHTML(player.username)}
        </h3>
        <span>#${index + 1}</span>
      </div>

      <div class="ranking-stats">
        <button class="ranking-stat"
          onclick="viewPlayerLibrary('${player.user_id}', 'Completed')">
          <small>✅ Completed</small>
          <strong>${player.completed}</strong>
        </button>

        <button class="ranking-stat"
          onclick="viewPlayerLibrary('${player.user_id}')">
          <small>🎮 Total Games</small>
          <strong>${player.total_games}</strong>
        </button>
      </div>
    </div>
  `).join("");
}

async function loadMyProfile() {
  const area = document.getElementById("profileContent");

  if (!currentUser) {
    area.textContent = "Please log in first.";
    return;
  }

  area.innerHTML = "Loading profile...";

  const { data: profile, error } = await supabaseClient
    .from("profiles")
    .select("username, avatar_url, is_public")
    .eq("user_id", currentUser.id)
    .single();

  if (error || !profile) {
    area.textContent = "Could not load your profile.";
    console.error(error);
    return;
  }

  area.innerHTML = `
    <div class="profile-card">
      <div class="profile-avatar">
        ${escapeHTML(profile.avatar_url || "🎮")}
      </div>

      <h2>${escapeHTML(profile.username)}</h2>
      <p class="profile-subtitle">Game Vault Player</p>

      <div class="profile-divider"></div>

      <label>Username</label>
      <input id="editUsername"
        value="${escapeHTML(profile.username)}"
        maxlength="30">

      <label>Avatar</label>
      <input id="editAvatar"
        value="${escapeHTML(profile.avatar_url || "🎮")}"
        placeholder="Enter an emoji or image URL">

      <label>Library Visibility</label>
      <select id="editVisibility">
        <option value="false"
          ${!profile.is_public ? "selected" : ""}>
          Private
        </option>
        <option value="true"
          ${profile.is_public ? "selected" : ""}>
          Public
        </option>
      </select>

      <button onclick="saveMyProfile()">
        Save Changes
      </button>

      <p id="profileMessage"></p>
    </div>
  `;
}



// =====================================
// SAVE PROFILE
// =====================================

async function saveMyProfile() {
  const username = document
    .getElementById("editUsername").value.trim();

  const avatar = document
    .getElementById("editAvatar").value.trim();

  const isPublic = document
    .getElementById("editVisibility").value === "true";

  const message = document.getElementById("profileMessage");

  if (!username) {
    message.textContent = "Username cannot be empty.";
    return;
  }

  if (avatar.startsWith("http")) {
    try {
      const url = new URL(avatar);
      if (url.protocol !== "https:") {
        message.textContent = "Image URLs must use HTTPS.";
        return;
      }
    } catch {
      message.textContent = "Please enter a valid image URL or emoji.";
      return;
    }
  }

  message.textContent = "Saving...";

  const { error } = await supabaseClient
    .from("profiles")
    .update({
      username: username,
      avatar_url: avatar || "🎮",
      is_public: isPublic
    })
    .eq("user_id", currentUser.id);

  if (error) {
    message.textContent =
      error.code === "23505"
        ? "That username is already taken."
        : "Could not save profile.";
    console.error(error);
    return;
  }

  message.textContent = "Profile saved!";
}
